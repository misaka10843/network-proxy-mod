plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT' apply false
    id 'net.neoforged.moddev' version '2.0.148' apply false
}
subprojects {
    apply plugin: 'java'
    group = rootProject.maven_group
    version = rootProject.mod_version
    base.archivesName = "networkproxy-${project.name}-${rootProject.minecraft_version}"
    java.toolchain.languageVersion = JavaLanguageVersion.of(25)
    java.withSourcesJar()
    tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 25 }
    sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
    sourceSets.main.resources.srcDir rootProject.file('common/src/main/resources')
    repositories {
        mavenCentral()
        maven { url = 'https://maven.shedaniel.me/' }
        maven { url = 'https://maven.terraformersmc.com/releases/' }
    }
    processResources {
        inputs.property 'version', project.version
        filesMatching(['fabric.mod.json', 'META-INF/neoforge.mods.toml']) { expand version: project.version }
    }
    jar { from(rootProject.file('LICENSE')) }
}
