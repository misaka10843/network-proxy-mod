plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT' apply false
    id 'net.neoforged.moddev' version '2.0.148' apply false
}
ext.httpsProxyLibraries = [
    'org.apache.httpcomponents.client5:httpclient5:5.6.5',
    'org.apache.httpcomponents.core5:httpcore5:5.4.4',
    'org.apache.httpcomponents.core5:httpcore5-h2:5.4.4'
]
subprojects {
    apply plugin: 'java'
    group = rootProject.maven_group
    version = rootProject.mod_version
    base.archivesName = "networkproxy-${project.name}-${rootProject.minecraft_version}"
    java.toolchain.languageVersion = JavaLanguageVersion.of(25)
    java.withSourcesJar()
    tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 25 }
    sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
    sourceSets.main.resources.srcDir rootProject.file('common/src/main/resources')
    sourceSets {
        regressionTest {
            java.srcDir rootProject.file('common/src/test/java')
            compileClasspath += sourceSets.main.output + configurations.compileClasspath
            runtimeClasspath += sourceSets.main.runtimeClasspath
        }
    }
    [
        testDownloadAuthentication: 'DownloadAuthenticationTest',
        testHttpsProxyAuthentication: 'HttpsProxyAuthenticationTest',
        testProxyHostnameResolution: 'ProxyHostnameResolutionTest'
    ].each { taskName, testClass ->
        def regression = tasks.register(taskName, JavaExec) {
            classpath = sourceSets.regressionTest.runtimeClasspath
            mainClass = "com.misaka10843.networkproxy.${testClass}"
            javaLauncher = javaToolchains.launcherFor(java.toolchain)
            workingDir = layout.buildDirectory.dir("tmp/${taskName}").get().asFile
            doFirst { workingDir.mkdirs() }
        }
        tasks.named('check') { dependsOn(regression) }
    }
    repositories {
        mavenCentral()
        maven { url = 'https://maven.shedaniel.me/' }
        maven { url = 'https://maven.terraformersmc.com/releases/' }
    }
    processResources {
        inputs.property 'version', project.version
        filesMatching(['fabric.mod.json', 'META-INF/neoforge.mods.toml']) { expand version: project.version }
    }
    jar { from(rootProject.file('LICENSE')) }
}
