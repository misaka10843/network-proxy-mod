plugins { id 'net.neoforged.moddev' }
neoForge {
    enable {
        version = rootProject.neoforge_version
        // Avoid the 26.3 source transformation failure in the recompilation pipeline.
        disableRecompilation = true
    }
    runs { client { client() } }
    mods { networkproxy { sourceSet sourceSets.main } }
}
dependencies {
    implementation "me.shedaniel.cloth:cloth-config-neoforge:${rootProject.cloth_version}"
    jarJar(implementation("io.netty:netty-handler-proxy:${rootProject.netty_version}") { transitive = false }) {
        version { strictly "[${rootProject.netty_version},4.3)"; prefer rootProject.netty_version }
    }
    jarJar(implementation("io.netty:netty-codec-socks:${rootProject.netty_version}") { transitive = false }) {
        version { strictly "[${rootProject.netty_version},4.3)"; prefer rootProject.netty_version }
    }
}
