plugins {
    id 'net.neoforged.moddev' version "${modDevGradle_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name + '-neoforge'
}

// Share the loader-agnostic code and resources with the Fabric module.
sourceSets {
    main {
        java.srcDir(rootProject.file('common/src/main/java'))
        resources.srcDir(rootProject.file('common/src/main/resources'))
    }
}

repositories {
    maven { url = 'https://maven.neoforged.net/releases/' }
    mavenCentral()
    maven { url = 'https://maven.aliyun.com/nexus/content/groups/public' }
}

neoForge {
    enable {
        version = project.neoForge_version
        // Minecraft 26.x ships deobfuscated classes, so skip NeoForm's
        // decompile/recompile pipeline entirely (much faster builds).
        disableRecompilation = true
    }

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${project.neoForge_version}"

    // Minecraft 26.2 bundles Netty 4.2 core modules but NOT the proxy handlers,
    // so we ship them via JarJar (same version family as the bundled Netty).
    jarJar(implementation("io.netty:netty-handler-proxy:${project.netty_version}")) {
        version {
            strictly '[4.2,)'
            prefer project.netty_version
        }
    }
    jarJar(implementation("io.netty:netty-codec-socks:${project.netty_version}")) {
        version {
            strictly '[4.2,)'
            prefer project.netty_version
        }
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    inputs.property 'archivesName', project.base.archivesName
    from('LICENSE') {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}
