name: Build and release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Mod version without v (for example 1.2.1 or 1.2.1-beta.1)'
        required: true
        type: string
      is_prerelease:
        description: 'Publish as a prerelease'
        type: boolean
        default: false

permissions:
  contents: write

# Releases share a tag namespace, even when they are run from different branches.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Validate version and branch
        env:
          VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$REF_TYPE" != branch ]]; then
            echo "::error::Select a branch, not a tag."
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Version must look like 1.2.3 or 1.2.3-beta.1, without a v prefix."
            exit 1
          fi
          git check-ref-format "refs/heads/$BRANCH"
          if git show-ref --verify --quiet "refs/tags/v$VERSION"; then
            echo "::error::Tag v$VERSION already exists. Choose a new version."
            exit 1
          fi
          if [[ "$(grep -c '^mod_version=' gradle.properties)" != 1 ]]; then
            echo "::error::gradle.properties must contain exactly one mod_version."
            exit 1
          fi

      - name: Update the version
        env:
          VERSION: ${{ inputs.version }}
        run: sed -i "s/^mod_version=.*/mod_version=$VERSION/" gradle.properties

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: Build both loaders
        run: |
          chmod +x ./gradlew
          ./gradlew :fabric:build :neoforge:build --no-daemon

      - name: Verify release artifacts
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          minecraft_version="$(sed -n 's/^minecraft_version=//p' gradle.properties)"
          for loader in fabric neoforge; do
            jar="$loader/build/libs/networkproxy-$loader-$minecraft_version-$VERSION.jar"
            if [[ ! -s "$jar" ]]; then
              echo "::error::Missing release artifact: $jar"
              exit 1
            fi
            echo "Found $jar"
          done
          echo "MINECRAFT_VERSION=$minecraft_version" >> "$GITHUB_ENV"

      - name: Save build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: networkproxy-${{ inputs.version }}
          if-no-files-found: error
          path: |
            fabric/build/libs/networkproxy-fabric-${{ env.MINECRAFT_VERSION }}-${{ inputs.version }}.jar
            neoforge/build/libs/networkproxy-neoforge-${{ env.MINECRAFT_VERSION }}-${{ inputs.version }}.jar

      - name: Commit the version and push its tag
        env:
          VERSION: ${{ inputs.version }}
          BRANCH: ${{ github.ref_name }}
          START_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # Refuse to publish a stale checkout if the branch moved during the build.
          remote_head="$(git ls-remote --exit-code origin "refs/heads/$BRANCH" | cut -f1)"
          if [[ "$remote_head" != "$START_SHA" ]]; then
            echo "::error::The selected branch changed during this run. Start a new release from its latest commit."
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gradle.properties
          if ! git diff --cached --quiet; then
            git commit -m "chore: release $VERSION"
          fi
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push --atomic origin "HEAD:refs/heads/$BRANCH" "refs/tags/v$VERSION:refs/tags/v$VERSION"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.is_prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          flags=(--verify-tag --generate-notes --title "v$VERSION")
          if [[ "$PRERELEASE" == true ]]; then
            flags+=(--prerelease)
          fi
          gh release create "v$VERSION" "${flags[@]}" \
            "fabric/build/libs/networkproxy-fabric-$MINECRAFT_VERSION-$VERSION.jar" \
            "neoforge/build/libs/networkproxy-neoforge-$MINECRAFT_VERSION-$VERSION.jar"
